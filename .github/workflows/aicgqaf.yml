# ============================================================
# AICGQAF v1.0 — GitHub Actions CI/CD Pipeline Workflow
# ============================================================
# Koji Dan Seya | TP090490 | CT095-6-M
# Asia Pacific University of Technology & Innovation
#
# Triggers on every pull request event (open, update, reopen).
# Orchestrates all three AICGQAF layers via AWS CodePipeline
# and direct script execution, with GitHub status checks at
# every quality gate.
#
# Required Repository Secrets:
#   AICGQAF_API_KEY        — API key for the AICGQAF REST endpoints
#   AICGQAF_ENDPOINT       — Base URL for the AICGQAF API Gateway
#   ANTHROPIC_API_KEY      — Claude API key for Layer 2
#   SONAR_TOKEN            — SonarQube authentication token
#   SONAR_HOST_URL         — SonarQube server URL
#   AWS_ACCESS_KEY_ID      — AWS credentials (limited IAM role)
#   AWS_SECRET_ACCESS_KEY  — AWS credentials
#   AWS_REGION             — AWS region (e.g., ap-southeast-1)
#   S3_BUCKET              — S3 bucket for artifacts
#   DYNAMODB_TABLE         — DynamoDB table name
#   SQS_QUEUE_URL          — SQS FIFO queue URL (Layer 3 tasks)
#   SNS_TOPIC_ARN          — SNS topic for notifications
# ============================================================

name: AICGQAF Quality Assurance Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - develop
      - "release/**"

# Cancel previous runs on the same PR when a new push arrives
concurrency:
  group: aicgqaf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write

env:
  REVIEW_ID: ${{ github.run_id }}-${{ github.event.pull_request.number }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  REPO_URL: ${{ github.event.repository.html_url }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  DYNAMODB_TABLE: ${{ secrets.DYNAMODB_TABLE }}
  SQS_QUEUE_URL: ${{ secrets.SQS_QUEUE_URL }}
  SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}

jobs:

  # ─────────────────────────────────────────────────────────
  # JOB 0: DETECT LANGUAGE
  # ─────────────────────────────────────────────────────────
  detect-language:
    name: Detect Primary Language
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      language: ${{ steps.detect.outputs.language }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect primary programming language
        id: detect
        run: |
          # Count files by extension to determine primary language
          PY=$(find . -name "*.py" ! -path "./.git/*" | wc -l)
          JS=$(find . \( -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" \) ! -path "./.git/*" ! -path "./node_modules/*" | wc -l)
          JV=$(find . -name "*.java" ! -path "./.git/*" | wc -l)
          CS=$(find . -name "*.cs" ! -path "./.git/*" | wc -l)

          echo "Python: $PY | JavaScript/TS: $JS | Java: $JV | C#: $CS"

          if [ "$PY" -ge "$JS" ] && [ "$PY" -ge "$JV" ] && [ "$PY" -ge "$CS" ]; then
            LANG="python"
          elif [ "$JS" -ge "$JV" ] && [ "$JS" -ge "$CS" ]; then
            LANG="javascript"
          elif [ "$JV" -ge "$CS" ]; then
            LANG="java"
          else
            LANG="csharp"
          fi

          echo "Detected primary language: $LANG"
          echo "language=$LANG" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────
  # JOB 1: LAYER 1 — AUTOMATED STATIC ANALYSIS
  # ─────────────────────────────────────────────────────────
  layer1-static-analysis:
    name: "Layer 1 — Static Analysis"
    runs-on: ubuntu-latest
    needs: detect-language
    timeout-minutes: 20
    outputs:
      l1_decision: ${{ steps.gate1.outputs.decision }}
      review_id:   ${{ steps.init.outputs.review_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialise review record
        id: init
        run: |
          echo "review_id=${{ env.REVIEW_ID }}" >> $GITHUB_OUTPUT
          echo "Review ID: ${{ env.REVIEW_ID }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AICGQAF dependencies
        run: |
          pip install boto3 requests --quiet

      # ── SonarQube ──────────────────────────────────────────
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=aicgqaf-${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.qualitygate.wait=true
        continue-on-error: true  # Analysis continues even if SonarQube gate fails

      # ── CodeQL ─────────────────────────────────────────────
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ needs.detect-language.outputs.language }}
          queries: security-extended

      - name: Build for CodeQL (compiled languages)
        if: needs.detect-language.outputs.language == 'java' || needs.detect-language.outputs.language == 'csharp'
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: /tmp/codeql-results
          upload: false  # We handle SARIF upload ourselves

      # ── Bandit (Python only) ───────────────────────────────
      - name: Run Bandit Security Scan
        if: needs.detect-language.outputs.language == 'python'
        run: |
          pip install bandit --quiet
          bandit -r . \
            --exclude .git,node_modules,venv,.venv,tests \
            -f json \
            -o /tmp/bandit-results.json \
            --confidence-level medium \
            --severity-level medium \
            -q || true
          echo "Bandit scan complete."

      # ── Generate PR diff ───────────────────────────────────
      - name: Generate PR diff
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > /tmp/pr.diff
          echo "Diff lines: $(wc -l < /tmp/pr.diff)"

      # ── Run Quality Gate 1 ─────────────────────────────────
      - name: Evaluate Quality Gate 1
        id: gate1
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          python .github/aicgqaf/scripts/layer1_static_analysis.py \
            --pr-number   ${{ env.PR_NUMBER }} \
            --repo-url    ${{ env.REPO_URL }} \
            --repo-path   . \
            --language    ${{ needs.detect-language.outputs.language }} \
            --review-id   ${{ env.REVIEW_ID }} \
            --output      /tmp/layer1_report.json

          DECISION=$(python -c "import json; d=json.load(open('/tmp/layer1_report.json')); print(d['layer1_decision'])")
          echo "decision=$DECISION" >> $GITHUB_OUTPUT
          echo "Layer 1 Decision: $DECISION"

      - name: Upload Layer 1 report artifact
        uses: actions/upload-artifact@v4
        with:
          name: layer1-report-${{ env.REVIEW_ID }}
          path: /tmp/layer1_report.json
          retention-days: 30

      # ── Post Gate 1 status check ───────────────────────────
      - name: Post Layer 1 status to GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const decision = '${{ steps.gate1.outputs.decision }}';
            const stateMap = { PASS: 'success', ESCALATE: 'pending', FAIL: 'failure' };
            const descMap  = {
              PASS:     'All static analysis checks passed — auto-approved.',
              ESCALATE: 'Issues detected — escalating to AI review (Layer 2).',
              FAIL:     'Critical issues found — pull request blocked.'
            };
            await github.rest.repos.createCommitStatus({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              sha:         context.payload.pull_request.head.sha,
              state:       stateMap[decision] || 'failure',
              description: descMap[decision]  || 'Layer 1 evaluation failed.',
              context:     'AICGQAF / Layer 1 — Static Analysis',
            });

      - name: Fail job if Layer 1 FAIL
        if: steps.gate1.outputs.decision == 'FAIL'
        run: |
          echo "::error::Layer 1 Quality Gate FAILED. Pull request blocked. See layer1_report.json for details."
          exit 1

  # ─────────────────────────────────────────────────────────
  # JOB 2: LAYER 2 — AI SEMANTIC REVIEW
  # Only runs when Layer 1 decision is ESCALATE
  # ─────────────────────────────────────────────────────────
  layer2-ai-review:
    name: "Layer 2 — AI Semantic Review"
    runs-on: ubuntu-latest
    needs: [detect-language, layer1-static-analysis]
    if: needs.layer1-static-analysis.outputs.l1_decision == 'ESCALATE'
    timeout-minutes: 10
    outputs:
      l2_decision: ${{ steps.gate2.outputs.decision }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache-dependency-path: '**/requirements*.txt'

      - name: Install dependencies
        run: pip install boto3 requests --quiet

      - name: Download Layer 1 report
        uses: actions/download-artifact@v4
        with:
          name: layer1-report-${{ env.REVIEW_ID }}
          path: /tmp

      - name: Generate PR diff
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > /tmp/pr.diff

      - name: Run Layer 2 AI Review
        id: gate2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python .github/aicgqaf/scripts/layer2_ai_review.py \
            --review-id     ${{ env.REVIEW_ID }} \
            --layer1-report /tmp/layer1_report.json \
            --repo-path     . \
            --pr-diff       /tmp/pr.diff \
            --language      ${{ needs.detect-language.outputs.language }} \
            --output        /tmp/layer2_report.json

          DECISION=$(python -c "import json; d=json.load(open('/tmp/layer2_report.json')); print(d.get('gate2_decision','ESCALATE'))")
          echo "decision=$DECISION" >> $GITHUB_OUTPUT
          echo "Layer 2 Decision: $DECISION"

      - name: Upload Layer 2 report artifact
        uses: actions/upload-artifact@v4
        with:
          name: layer2-report-${{ env.REVIEW_ID }}
          path: /tmp/layer2_report.json
          retention-days: 30

      - name: Post Layer 2 status to GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const decision = '${{ steps.gate2.outputs.decision }}';
            const stateMap = { APPROVE: 'success', ESCALATE: 'pending', REJECT: 'failure' };
            const descMap  = {
              APPROVE:  'AI semantic review passed — auto-approved.',
              ESCALATE: 'AI review inconclusive — escalating to human review (Layer 3).',
              REJECT:   'AI review found critical issues — pull request blocked.'
            };
            await github.rest.repos.createCommitStatus({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              sha:         context.payload.pull_request.head.sha,
              state:       stateMap[decision] || 'failure',
              description: descMap[decision]  || 'Layer 2 evaluation failed.',
              context:     'AICGQAF / Layer 2 — AI Semantic Review',
            });

      - name: Fail job if Layer 2 REJECT
        if: steps.gate2.outputs.decision == 'REJECT'
        run: |
          echo "::error::Layer 2 Quality Gate REJECTED. See layer2_report.json for semantic/security details."
          exit 1

  # ─────────────────────────────────────────────────────────
  # JOB 3: FINAL DECISION ORCHESTRATOR
  # Runs after both Layer 1 and Layer 2 (if applicable)
  # ─────────────────────────────────────────────────────────
  final-decision:
    name: "Final Decision"
    runs-on: ubuntu-latest
    needs: [detect-language, layer1-static-analysis, layer2-ai-review]
    # Run if: Layer 1 PASS, or Layer 2 APPROVE/ESCALATE
    if: |
      always() &&
      needs.layer1-static-analysis.result != 'failure' &&
      (needs.layer2-ai-review.result == 'success' || needs.layer2-ai-review.result == 'skipped')
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install boto3 requests --quiet

      - name: Download Layer 1 report
        uses: actions/download-artifact@v4
        with:
          name: layer1-report-${{ env.REVIEW_ID }}
          path: /tmp
        continue-on-error: true

      - name: Download Layer 2 report
        if: needs.layer2-ai-review.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: layer2-report-${{ env.REVIEW_ID }}
          path: /tmp
        continue-on-error: true

      - name: Run Final Decision Orchestrator
        id: final
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          L2_FLAG=""
          if [ -f /tmp/layer2_report.json ]; then
            L2_FLAG="--layer2-report /tmp/layer2_report.json"
          fi

          python .github/aicgqaf/scripts/final_decision.py \
            --review-id     ${{ env.REVIEW_ID }} \
            --layer1-report /tmp/layer1_report.json \
            $L2_FLAG \
            --pr-number     ${{ env.PR_NUMBER }} \
            --repo-url      ${{ env.REPO_URL }} \
            --github-token  ${{ secrets.GITHUB_TOKEN }}

      - name: Post final pipeline status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const l1 = '${{ needs.layer1-static-analysis.outputs.l1_decision }}';
            const l2 = '${{ needs.layer2-ai-review.outputs.l2_decision }}';

            let state = 'success';
            let description = 'AICGQAF pipeline complete — approved for merge.';

            if (l2 === 'ESCALATE') {
              state = 'pending';
              description = 'Awaiting human reviewer decision (Layer 3).';
            } else if (l1 === 'FAIL' || l2 === 'REJECT') {
              state = 'failure';
              description = 'Pipeline blocked by quality gate failure.';
            }

            await github.rest.repos.createCommitStatus({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              sha:         context.payload.pull_request.head.sha,
              state:       state,
              description: description,
              context:     'AICGQAF / Pipeline — Final Decision',
            });
